<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Race Chain</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
  <script src="main.js"></script>
</head>
<body>
  <div class="content">
    <h2 id="action">Race Chain</h2>

    <button class="action" onclick="sendMessage('race')">Race</button>
    <div id="messages"></div>
  </div>
</body>
</html>
